# Checks run on every push and pull request. The "Mettre à jour" button of the panel installs code as root:
# protect main on GitHub so only commits that pass these checks reach it, and sign the release tags (docs/RELEASING.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Vérifications
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Shell — shellcheck
        run: shellcheck -S warning install.sh system/hostkeep-action system/hostkeep-cli system/restore.sh tests/helper/*.sh tests/integration/*.sh tools/*.sh tools/git-hooks/*

      - name: Helper root — tests
        run: for t in tests/helper/*_test.sh; do bash "$t"; done

      - name: JavaScript — syntaxe
        run: for f in $(git ls-files 'app/public/*.js'); do node --check "$f"; done

      - name: Manifest PWA — JSON valide
        run: for f in $(git ls-files 'app/public/*.json'); do python3 -m json.tool "$f" >/dev/null; done

      - name: sudoers — syntaxe
        run: sudo visudo -cf system/sudoers-hostkeep

  php:
    # Every PHP version of the supported distributions: 8.1 (Ubuntu 22.04), 8.2 (Debian 12), 8.3 (Ubuntu 24.04), 8.4 (Debian 13)
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe et tests
        run: |
          docker run --rm -v "$PWD:/src" -w /src php:${{ matrix.php }}-cli sh -c '
            php -v | head -1
            find app tests -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null || exit 1
            for t in tests/php/*_test.php; do php "$t" || exit 1; done'

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aucun secret dans l'historique
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source=/repo --redact -v

  attribution:
    # No tool-generated attribution (AI co-author trailers, "Generated with …" footers) in new commits or in files.
    name: Attribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fichiers suivis
        run: tools/check-attribution.sh --files
      - name: Messages des nouveaux commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z $BASE || $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="$HEAD~1"; fi
          tools/check-attribution.sh --range "$BASE..$HEAD"

  schema:
    name: Schéma MariaDB
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Charger schema.sql deux fois (doit être idempotent)
        run: |
          mysql -h 127.0.0.1 -uroot -pci < app/bin/schema.sql
          mysql -h 127.0.0.1 -uroot -pci < app/bin/schema.sql
          mysql -h 127.0.0.1 -uroot -pci -e 'SHOW TABLES' hostkeep
          mysql -h 127.0.0.1 -uroot -pci -e "SHOW GRANTS FOR 'hostkeep'@'localhost'"

# Hostkeep, HTTPS part. PHP runs in its own pool (user "hostkeep").
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName admin.mmi24c04.mmi-troyes.fr
    DocumentRoot /var/www/hostkeep/public
    <Directory /var/www/hostkeep/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm-hostkeep.sock|fcgi://hostkeep"
    </FilesMatch>
    <LocationMatch "^/assets/">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog ${APACHE_LOG_DIR}/hostkeep-error.log
    CustomLog ${APACHE_LOG_DIR}/hostkeep-access.log combined
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/admin.mmi24c04.mmi-troyes.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/admin.mmi24c04.mmi-troyes.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

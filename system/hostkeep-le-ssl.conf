# Hostkeep, HTTPS part (Apache). PHP runs in its own pool (user "hostkeep").
# The domain and PHP version placeholders are replaced at install time.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName __DOMAIN__
    DocumentRoot /var/www/hostkeep/public
    <Directory /var/www/hostkeep/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php__PHP_VERSION__-fpm-hostkeep.sock|fcgi://hostkeep"
    </FilesMatch>
    <LocationMatch "^/assets/">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog ${APACHE_LOG_DIR}/hostkeep-error.log
    CustomLog ${APACHE_LOG_DIR}/hostkeep-access.log combined
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off
</VirtualHost>
</IfModule>

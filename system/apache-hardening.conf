# Server-wide protection of files that must never be downloadable, on every site.
# PHP code still reads them from disk normally: only HTTP access is refused (403).
# Installed as /etc/apache2/conf-available/hardening.conf (a2enconf hardening).

# Git repositories (.git/HEAD, .git/config, objects...)
<DirectoryMatch "/\.git(/|$)">
    Require all denied
</DirectoryMatch>

# Dump / backup folders inside the sites (e.g. /sql/ with the database exports)
<DirectoryMatch "^/(var/www|home/[^/]+/public_html)/.+/(sql|backups?|dumps?)(/|$)">
    Require all denied
</DirectoryMatch>

# Secrets, dumps, archives and leftovers, wherever they are
<FilesMatch "^\.(env|git|htpasswd|DS_Store)|\.(sql|sql\.gz|dump|bak|old|orig|swp|swo|log)$|~$">
    Require all denied
</FilesMatch>
# phpinfo() pages leak the whole server configuration.
<FilesMatch "^(php)?info\.php$">
    Require all denied
</FilesMatch>
# No automatic directory listings on the sites in /var/www (public_html is left as is).
# DirectoryMatch is applied after <Directory> and .htaccess, so it wins over "Options Indexes".
<DirectoryMatch "^/var/www/">
    Options -Indexes
</DirectoryMatch>

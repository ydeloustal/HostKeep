# Hostkeep for Nginx. The domain and PHP version placeholders are replaced at install time.
# Note: the "Sites", "Trafic" and vhost pages read the Apache configuration and logs only;
# on an Nginx-only server they stay empty, everything else works.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt challenge (certbot --webroot), everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hostkeep/public;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    root /var/www/hostkeep/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:hostkeep:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/hostkeep-access.log;
    error_log  /var/log/nginx/hostkeep-error.log;

    # No dotfiles (the .env lives one level up, outside the web root, but better safe).
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-hostkeep.sock;
    }
}

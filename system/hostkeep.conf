# Hostkeep, HTTP part (Apache): serves the Let's Encrypt challenge, redirects everything else to HTTPS.
# The domain placeholder is replaced by HOSTKEEP_DOMAIN at install time.
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot /var/www/hostkeep/public
    <Directory /var/www/hostkeep/public/.well-known/acme-challenge>
        Require all granted
    </Directory>
    RedirectMatch 301 ^/(?!\.well-known/acme-challenge/)(.*)$ https://__DOMAIN__/$1
</VirtualHost>

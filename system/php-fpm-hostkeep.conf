; Hostkeep pool: own user, no process at rest (ondemand), confined by open_basedir.
; The PHP version placeholder is replaced at install time.
[hostkeep]
user = hostkeep
group = hostkeep
listen = /run/php/php__PHP_VERSION__-fpm-hostkeep.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s
pm.max_requests = 300
request_terminate_timeout = 60s
php_admin_value[open_basedir] = /var/www/hostkeep/:/var/lib/hostkeep/:/var/log/hostkeep/:/var/backups/hostkeep/:/proc/:/usr/lib/os-release:/etc/os-release
php_admin_value[session.save_path] = /var/lib/hostkeep/sessions
php_admin_value[session.gc_maxlifetime] = 1800
php_admin_value[error_log] = /var/log/hostkeep/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 64M

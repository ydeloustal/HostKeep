; Hostkeep: dedicated PHP-FPM, started by hostkeep.service (not by the system phpX.Y-fpm).
; Generated by install.sh: __WEB_GROUP__ is the group of the web server that talks to the socket.
[global]
pid = /run/hostkeep/php-fpm.pid
error_log = /var/log/hostkeep/php-fpm.log
log_level = warning
daemonize = no

[hostkeep]
user = hostkeep
group = hostkeep
listen = /run/hostkeep/php-fpm.sock
listen.owner = hostkeep
listen.group = __WEB_GROUP__
listen.mode = 0660
; no process at rest, a few at most: a handful of admins use the panel
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 300
; long enough to download a full backup (streamed); CPU time stays capped by max_execution_time
request_terminate_timeout = 6h
catch_workers_output = yes
php_admin_value[open_basedir] = /var/www/hostkeep/:/var/lib/hostkeep/:/var/log/hostkeep/:/var/backups/hostkeep/:/proc/:/usr/lib/os-release:/etc/os-release
php_admin_value[session.save_path] = /var/lib/hostkeep/sessions
; idle timeout is enforced by the app (Paramètres › Sécurité); files are cleaned after one day
php_admin_value[session.gc_maxlifetime] = 86400
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[error_log] = /var/log/hostkeep/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 64M
php_admin_value[post_max_size] = 1M

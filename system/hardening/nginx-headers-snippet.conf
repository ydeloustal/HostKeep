# Hostkeep — the same security headers, for a server or location block that has its own add_header:
#   include snippets/hostkeep-headers.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $hostkeep_hsts always;

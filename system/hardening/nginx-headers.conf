# Hostkeep — security headers for every site (Sécurité › Audit › Corriger), http context.
# Nginx rule: a server or location block that has its OWN add_header does not inherit these lines;
# the audit then lists it, add « include snippets/hostkeep-headers.conf; » to that block.
# HSTS only on HTTPS answers (empty value = header not sent), 6 months, without includeSubDomains/preload.
map $https $hostkeep_hsts { on "max-age=15552000"; default ""; }
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $hostkeep_hsts always;

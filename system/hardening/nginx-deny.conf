# Hostkeep — refuse the files that must never be downloadable (Sécurité › Audit › Corriger).
# Nginx cannot do this for all sites at once: add, in each server block of your sites,
#   include snippets/hostkeep-deny.conf;   (at the top of the block, before the « location ~ \.php$ »)
# PHP still reads these files from disk normally: only HTTP access is refused (403).
location ~ /\.(?!well-known/) { deny all; }
location ~* \.(sql|sql\.gz|dump|bak|old|orig|swp|swo|log)$ { deny all; }
location ~* ~$ { deny all; }
location ~* (^|/)(php)?info\.php$ { deny all; }
location ~* (^|/)composer\.(json|lock)$ { deny all; }
location ~* ^/(.+/)?(sql|backups?|dumps?)/ { deny all; }
autoindex off;

# Hostkeep — security headers for every site (Sécurité › Audit › Corriger). Needs mod_headers.
# "setifempty": a header already sent by a site (PHP, .htaccess, vhost) is never replaced.
# HSTS only on HTTPS answers, 6 months, without includeSubDomains/preload, so that it can be undone.
# Installed as /etc/apache2/conf-available/hostkeep-headers.conf (a2enconf / a2disconf hostkeep-headers).
<IfModule mod_headers.c>
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty X-Frame-Options "SAMEORIGIN"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
    Header setifempty Strict-Transport-Security "max-age=15552000" "expr=%{HTTPS} == 'on'"
</IfModule>

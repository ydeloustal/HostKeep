# Admin dashboard: one extra access log, with the virtual host name on each line,
# for the traffic statistics. GlobalLog applies to every vhost, even those with their own CustomLog.
# Rotated with the other Apache logs (/etc/logrotate.d/apache2).
LogFormat "%v %a %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" dashboard_traffic
GlobalLog ${APACHE_LOG_DIR}/dashboard-traffic.log dashboard_traffic
